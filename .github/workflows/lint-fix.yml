name: Format policy on request

# GitHub has no workflow trigger for emoji reactions, so the one-click path is a
# task-list box: ticking the box in the lint report comment is an
# `issue_comment: edited` event. Commenting `/fmt` does the same thing.
on:
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  # One formatter at a time per PR -- two concurrent runs would race on the push.
  group: lint-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fmt:
    # `sender` is whoever typed or edited; skipping our own edits stops this
    # workflow from retriggering itself when it rewrites the report comment.
    if: >-
      github.event.issue.pull_request &&
      github.event.sender.login != 'github-actions[bot]' &&
      (
        (github.event.action == 'created' &&
         startsWith(github.event.comment.body, '/fmt')) ||
        (github.event.action == 'edited' &&
         contains(github.event.comment.body, '<!-- acl-lint-report -->') &&
         (contains(github.event.comment.body, '- [x] **Format it for me.**') ||
          contains(github.event.comment.body, '- [X] **Format it for me.**')))
      )
    runs-on: ubuntu-latest
    permissions:
      # Pushes the reformatted policy file onto the PR branch on the fallback
      # path. When the app token is configured, that token does the pushing.
      contents: write
      pull-requests: write
    env:
      # A GITHUB_TOKEN push to a PR head does create a pull_request run, but
      # GitHub holds it in an approval-required state, so someone has to click
      # "Approve and run" before the acls check goes green. A GitHub App's push
      # runs without that click, so with the app secrets present the fix
      # self-completes; without them this falls back to GITHUB_TOKEN and the
      # reply tells the author about the approval. (Re-running the old failed
      # check is never a substitute: a re-run reuses the commit that triggered
      # the original run, i.e. the unformatted one.) `secrets` is readable here
      # at job level, which is what lets the steps below branch on it.
      #
      # To set the app up: create a GitHub App owned by the org (not a person,
      # so it outlives them) with Webhook unchecked and exactly one repository
      # permission, Contents: read and write -- comments and PR reads stay on
      # GITHUB_TOKEN, which is also what keeps the loop guard above correct.
      # Note its App ID, generate a private key, then *install* it on this repo
      # (easy to miss: creating an app does not install it, and with no
      # installation the token request 404s where a bad key 401s). Finally set
      # the two secrets below. Installation tokens last an hour; the private key
      # is durable and is the one credential here that needs rotating.
      HAVE_APP: ${{ secrets.FMT_APP_ID != '' && secrets.FMT_APP_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ACTOR: ${{ github.event.sender.login }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Acknowledge the request
        # Only for `/fmt`: on the checkbox path the "comment" is the bot's own
        # report, and reactions there would pile up run after run.
        if: github.event.action == 'created'
        run: |
          gh api --method POST --silent \
            "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes || true

      # `issue_comment` carries no branch and no permission check of its own:
      # anyone who can comment can fire this event. Both are established here,
      # before the PR's own code is checked out.
      - name: Check the requester can write to this repo
        run: |
          level="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" \
            --jq .permission 2>/dev/null || echo none)"
          if [ "$level" != "admin" ] && [ "$level" != "write" ]; then
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -f "body=@${ACTOR} doesn't have write access to this repository, so I won't push a commit to this branch."
            exit 1
          fi

      - name: Resolve the PR branch
        id: pr
        run: |
          gh pr view "$PR" --repo "$REPO" \
            --json headRefName,headRepository,headRepositoryOwner,state \
            > pr.json
          state="$(jq -r .state pr.json)"
          head_repo="$(jq -r '.headRepositoryOwner.login + "/" + .headRepository.name' pr.json)"
          head_ref="$(jq -r .headRefName pr.json)"

          if [ "$state" != "OPEN" ]; then
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -f "body=This PR is \`${state}\`, so there's nothing to format."
            exit 1
          fi
          if [ "$head_repo" != "$REPO" ]; then
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" \
              -f "body=This PR comes from \`${head_repo}\`, and this workflow's token can't push to a fork. Run \`python3 scripts/fmt_policy.py\` locally and push the result."
            exit 1
          fi
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      # Short-lived (1h) installation token. The durable secret is the app's
      # private key, which is the one thing here that needs rotating.
      - name: Mint an app push token
        id: apptoken
        if: env.HAVE_APP == 'true'
        # Never fail the formatter over app configuration. If the app isn't
        # installed on this repo, or its key has been rotated out, this step
        # fails, the token comes back empty, and everything below falls back to
        # GITHUB_TOKEN -- the fix still lands, it just needs the approval click.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FMT_APP_ID }}
          private-key: ${{ secrets.FMT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          # Leaves the push credential in .git/config for the push step below.
          token: ${{ steps.apptoken.outputs.token || github.token }}
          persist-credentials: true

      - name: Format and commit
        id: fmt
        run: |
          python3 scripts/fmt_policy.py
          if git diff --quiet -- policy.hujson; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n\n%s\n' \
            "style: format policy.hujson" \
            "Requested by @${ACTOR} via ${RUN_URL}." > "$RUNNER_TEMP/msg"
          git commit -F "$RUNNER_TEMP/msg" -- policy.hujson
          git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Fallback path only. The GITHUB_TOKEN push's run is held for approval, so
      # the report comment could sit stale indefinitely; rewrite it here from
      # the formatted tree instead. With an app token the push's run starts
      # immediately and its own `report` job does this, so doing it here too
      # would just race that run.
      - name: Rewrite the lint report
        # Runs even when nothing changed: regenerating the comment from the
        # template is also what unticks the box, so it can be used again.
        if: steps.fmt.conclusion == 'success' && steps.apptoken.outputs.token == ''
        env:
          SAME_REPO: "true"
          SHA: ${{ steps.fmt.outputs.sha }}
        run: |
          out="$(python3 scripts/fmt_policy.py --check 2>&1)" && code=0 || code=$?
          LINT_OUTPUT="$out" LINT_CODE="$code" scripts/lint_comment.sh

      - name: Say what happened
        # The guard steps above post their own explanation when they refuse, so
        # this only reports on runs that got as far as the branch.
        if: always() && steps.pr.outcome == 'success'
        env:
          # What the push actually used, which is not the same as what was
          # configured -- see the fallback note on the mint step.
          USED_APP: ${{ steps.apptoken.outputs.token != '' }}
        run: |
          case "${{ steps.fmt.outputs.changed }}" in
            true)
              sha="${{ steps.fmt.outputs.sha }}"
              pushed="Formatted \`policy.hujson\` and pushed \`${sha:0:7}\` to \`${{ steps.pr.outputs.head_ref }}\`."
              if [ "$USED_APP" = "true" ]; then
                body="$(printf '%s %s\n' "$pushed" \
                  "The checks are re-running against it now.")"
              else
                body="$(printf '%s\n\n%s\n' "$pushed" \
                  "The \`acls\` run on that commit is **waiting for approval** -- GitHub holds runs from commits pushed with \`GITHUB_TOKEN\` until someone with write access clicks **Approve and run** on the PR's checks. Configuring \`FMT_APP_ID\` / \`FMT_APP_PRIVATE_KEY\` removes that step.")"
              fi
              reaction="+1" ;;
            false)
              body="\`policy.hujson\` was already formatted -- nothing to commit."
              reaction="+1" ;;
            *)
              body="The formatter didn't finish. See the [run log](${RUN_URL})."
              reaction="-1" ;;
          esac
          gh api --method POST --silent "repos/${REPO}/issues/${PR}/comments" -f "body=$body"
          if [ "${{ github.event.action }}" = "created" ]; then
            gh api --method POST --silent \
              "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f "content=$reaction" || true
          fi
