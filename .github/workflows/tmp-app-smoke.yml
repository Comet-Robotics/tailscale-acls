# TEMPORARY. Verifies FMT_APP_ID / FMT_APP_PRIVATE_KEY can mint an installation
# token for this repo, before lint-fix.yml depends on it. Delete once confirmed.
name: TEMP app token smoke test

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token
        id: t
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FMT_APP_ID }}
          private-key: ${{ secrets.FMT_APP_PRIVATE_KEY }}

      # Prints no secret: the token is masked, and these are its scopes only.
      - name: Report what the token can reach
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
        run: |
          echo "installation-id: ${{ steps.t.outputs.installation-id }}"
          gh api installation/repositories \
            --jq '{repos: [.repositories[].full_name]}'
          gh api "repos/${{ github.repository }}" --jq '{permissions}'
