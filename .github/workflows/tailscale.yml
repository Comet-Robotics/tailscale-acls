name: Sync Tailscale ACLs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: acls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `acls` is the required status check in the "Protect main" ruleset, so the
  # lint stays a step *inside* it: a lint failure has to turn this check red.
  # A separate lint job would leave `acls` skipped, and a skipped required check
  # counts as a passing one.
  acls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so the Tailscale action can request a GitHub OIDC token and
      # exchange it for a tailnet API token via federated identity.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Runs on both events, before the tailnet is touched: a malformed policy
      # or a collapsed group array fails the PR rather than reaching Tailscale.
      - name: Lint policy file
        run: python3 scripts/fmt_policy.py --check

      # Pull requests get a READ-ONLY credential (policy_file:read), whose trust
      # credential is scoped to subject repo:...@<repo id>:pull_request. A PR therefore
      # cannot apply ACLs even if it edits this workflow.
      #
      # This is also why workflow_dispatch is not a way to re-trigger a stale
      # check, even though dispatch events are exempt from the rule that a
      # GITHUB_TOKEN push starts no run: on a dispatch this step is skipped and
      # a branch-ref OIDC subject isn't trusted by either tailnet credential,
      # so the run would report a green `acls` that never tested the policy.
      - name: Test ACL
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID_TEST }}
          audience: ${{ secrets.TS_AUDIENCE_TEST }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test

      # Only pushes to main get the write credential, whose trust credential is
      # scoped to subject repo:...@<repo id>:ref:refs/heads/main. The ref check below
      # is defense in depth for the same thing.
      - name: Deploy ACL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID_APPLY }}
          audience: ${{ secrets.TS_AUDIENCE_APPLY }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply

  # Reports the lint result as a comment. Deliberately separate from `acls` and
  # deliberately not required: it holds the only `pull-requests: write` token in
  # this workflow, and it must not be able to affect whether the PR can merge.
  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Lint policy file
        id: lint
        run: |
          set +e
          out="$(python3 scripts/fmt_policy.py --check 2>&1)"
          code=$?
          set -e
          echo "$out"
          {
            echo 'output<<LINT_EOF'
            echo "$out"
            echo 'LINT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR
        # The script exits with the linter's code; `acls` is what carries that
        # failure to the PR, so a red lint must not also redden this job.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LINT_OUTPUT: ${{ steps.lint.outputs.output }}
          LINT_CODE: ${{ steps.lint.outputs.exit-code }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: scripts/lint_comment.sh
