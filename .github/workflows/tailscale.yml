name: Sync Tailscale ACLs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # Required so the Tailscale action can request a GitHub OIDC token and
  # exchange it for a tailnet API token via federated identity.
  id-token: write

jobs:
  acls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pull requests get a READ-ONLY credential (policy_file:read), whose trust
      # credential is scoped to subject repo:<repo>:pull_request. A PR therefore
      # cannot apply ACLs even if it edits this workflow.
      - name: DEBUG dump OIDC claims
        env:
          AUD: ${{ secrets.TS_AUDIENCE_TEST }}
        run: |
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "$TOK" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -m json.tool || true

      - name: Test ACL
        if: github.event_name == 'pull_request'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID_TEST }}
          audience: ${{ secrets.TS_AUDIENCE_TEST }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test

      # Only pushes to main get the write credential, whose trust credential is
      # scoped to subject repo:<repo>:ref:refs/heads/main.
      - name: Deploy ACL
        if: github.event_name == 'push'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID_APPLY }}
          audience: ${{ secrets.TS_AUDIENCE_APPLY }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply
